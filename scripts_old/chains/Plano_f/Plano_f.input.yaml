likelihood:
  lnlike:
    external: true
    input_params:
    - h0
    - wm
    - f
params:
  h0:
    prior:
      min: 40.0
      max: 100.0
    latex: H_{0}
  wm:
    prior:
      min: 0.0
      max: 3.0
    latex: \Omega_{m}
  wl:
    derived: 'lambda wm: 1 - wm'
  f:
    prior:
      min: 0.1
      max: 2.0
    latex: f
sampler:
  polychord:
    nlive: 200
output: Plano_f
